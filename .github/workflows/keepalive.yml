# GitHub 会在仓库连续 60 天无活动后自动停用所有定时任务，而定时任务自身的运行
# 并不算「活动」。这个工作流每月提交一次时间戳，使日报的 schedule 不会被静默停掉。
name: 保活

on:
  schedule:
    - cron: "0 3 1 * *" # 每月 1 日
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: 更新时间戳并提交
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive
          # 已是最新则不产生空提交
          git diff --staged --quiet && exit 0
          git commit -m "chore: 保活提交，避免定时任务被自动停用"
          git push
