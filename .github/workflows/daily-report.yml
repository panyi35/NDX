name: 美股指数日报

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC。22:30 UTC 对应美东 17:30(EDT) / 17:30(EST)，
    # 两个时段都在收盘之后，因此夏令时切换无需改动。
    - cron: "30 22 * * 1-5"
    # 周六的心跳：无论上周是否休市都一定发出，用来证明定时任务还活着。
    # 没收到心跳就说明任务被停用了，而不是「本周恰好没有异动」。
    - cron: "0 1 * * 6"
  workflow_dispatch:
    inputs:
      force:
        # 人工触发通常是为了立刻看到结果，默认开启；取消勾选可复现定时任务的休市跳过行为。
        description: "最新收盘日不是当天也照常发送"
        type: boolean
        default: true

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 生成并发送日报
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          FLAGS=""
          [ "$SCHEDULE" = "0 1 * * 6" ] && FLAGS="$FLAGS --heartbeat"
          [ "$FORCE_INPUT" = "true" ] && FLAGS="$FLAGS --force"
          python -m ndxmon.main --out out/preview.html $FLAGS

      # 失败时保留渲染结果便于排查；任务本身失败会由 GitHub 自动发邮件给仓库所有者。
      - name: 保留渲染产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview
          path: out/
          if-no-files-found: ignore
          retention-days: 7
